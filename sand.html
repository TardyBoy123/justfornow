<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#eeedf5"><title>Falling Sand — justfornow.me</title><script src="theme.js"></script><link rel="stylesheet" href="styles.css"><script src="sand.js" defer></script><script src="tools.js" defer></script></head>
<body class="tool-page" data-tool="sand"><main class="tool-shell"><header class="tool-top"><a class="wordmark" href="index.html">justfornow<span>.me</span> ✳</a><a href="index.html">← All channels</a></header><p class="tool-kicker">02.A / SMALL EXPERIMENTS</p><h1>Falling Sand</h1><p class="tool-description">Click or touch the canvas. Let the sand fall.</p><div class="sand-layout"><canvas id="canvas" class="sand-canvas" width="400" height="400" aria-label="Interactive falling sand canvas. Draw with a mouse or touch; alternatively use the Drop sand button."></canvas><div><label class="field">Grain size <span id="grainSizeValue">2 px</span><input type="range" id="grainSize" min="1" max="10" value="2"></label><label class="field">Hue speed <span id="hueSpeedValue">1</span><input type="range" id="hueSpeed" min="1" max="50" value="1"></label><label class="field">Spawn amount <span id="spawnAmountValue">3</span><input type="range" id="spawnAmount" min="1" max="10" value="3"></label><label class="check-label"><input type="checkbox" id="backgroundImage"> Cat background</label><div class="actions"><button id="drop-sand">Drop sand</button><button id="clearCanvas">Clear canvas</button></div><p class="fine-print">Changing the grain size starts a fresh canvas.</p></div></div><noscript><p>This interactive tool needs JavaScript enabled.</p></noscript></main></body></html>
